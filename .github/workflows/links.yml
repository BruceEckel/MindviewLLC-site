name: Links

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check external links
        id: check
        run: |
          status=0
          uv run check_links.py --markdown > report.md || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat report.md
          # Exit status 1 means broken links. Anything else is a crash in the script.
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Report broken links
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken links found"
          number=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi

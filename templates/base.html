<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{{ site.description }}">
{% if site.preview %}<meta name="robots" content="noindex">
{% endif %}
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:image" content="{{ site.origin }}{{ site.base }}{{ site.logo }}">
<meta property="og:type" content="website">
<link rel="icon" href="{{ site.favicon }}">
<link rel="stylesheet" href="/css/site.css?v={{ site.version }}">
<script>
try {
  var theme = localStorage.getItem("theme");
  if (theme) document.documentElement.dataset.theme = theme;
} catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="/">
      <img src="{{ site.logo }}" alt="" width="40" height="40">
      <span>{{ site.title }}</span>
    </a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav id="nav" aria-label="Main">
      {% for name, url in site.nav %}
      {% if url.startswith("/") %}
      <a href="{{ url }}"{% if url == current %} aria-current="page"{% endif %}>{{ name }}</a>
      {% else %}
      <a href="{{ url }}" target="_blank" rel="noopener">{{ name }} <span aria-hidden="true">&nearr;</span></a>
      {% endif %}
      {% endfor %}
      <button class="theme-button" type="button" aria-label="Switch between light and dark theme">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 0 18V3z"/><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </nav>
  </div>
</header>
<main id="main">
{% block main %}{% endblock %}
</main>
<footer class="foot">
  <div class="foot-inner">
    <p><strong>{{ site.title }} LLC</strong><br>{{ site.tagline }}</p>
    <p>
      <a href="/about/">About and contact</a> &middot;
      <a href="/about/W9.pdf">IRS Form W-9</a>
    </p>
  </div>
</footer>
<script src="/js/site.js?v={{ site.version }}"></script>
</body>
</html>
